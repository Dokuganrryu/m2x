[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/dsp", "crates/stream", "crates/device", "crates/golden", "crates/source-rules"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.sound2]
# WHY: sound2 size check, the 14-band image overflowed the 0x29400-byte image region by 15 KB at opt-level 3; the board crate (thread, console, panel, presets) is compiled for size, leaving 15 KB spare; device stays at opt-level 3 because at opt-level s or z the hand-over gate's image scan found panic paths, cpsid and udiv reachable from usb_interrupt; the tick's emulated span is 4,005 instructions at 14 bands either way
inherits = "release"

[profile.sound2.package.board]
opt-level = "s"
